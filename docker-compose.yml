services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    logging:
      driver: "none"

  wpdbot:
    build: .
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/bot.db
      DOWNLOAD_DIR: /tmp/wpdbot-downloads
      WHATSAPP_AUTH_DIR: /app/.wwebjs_auth
      WHATSAPP_CACHE_DIR: /app/.wwebjs_cache
      YT_DLP_COOKIES_PATH: ${YT_DLP_COOKIES_HOST_PATH:+/run/secrets/yt-dlp-cookies.txt}
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      - bgutil-provider
    volumes:
      - wpdbot-auth:/app/.wwebjs_auth
      - wpdbot-cache:/app/.wwebjs_cache
      - wpdbot-data:/data
      - wpdbot-downloads:/tmp/wpdbot-downloads
      - type: bind
        source: ${YT_DLP_COOKIES_HOST_PATH:-/dev/null}
        target: /run/secrets/yt-dlp-cookies.txt
        read_only: true
        bind:
          create_host_path: false

volumes:
  wpdbot-auth:
  wpdbot-cache:
  wpdbot-data:
  wpdbot-downloads:
